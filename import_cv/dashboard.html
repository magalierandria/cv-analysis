<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-result { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-slate-100 p-8">
        
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900">Analyseur de CV</h1>
            <p class="text-slate-500 mt-2">Extractions intelligentes par IA</p>
        </header>

        <div id="dropZone" class="group border-2 border-dashed border-slate-200 rounded-2xl p-8 bg-slate-50 hover:border-indigo-500 hover:bg-indigo-50 transition-all cursor-pointer text-center">
            <div class="text-4xl mb-3 transition-transform group-hover:scale-110">📂</div>
            <p class="font-semibold text-slate-700">Cliquez pour choisir un CV</p>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Format PDF accepté</p>
            <input type="file" id="fileInput" class="hidden" accept=".pdf" />
        </div>

        <button id="btn" class="w-full mt-6 bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-indigo-600 transition-all transform hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50" disabled>
            Analyser le document
        </button>

        <div id="loader" class="hidden mt-6 text-center text-indigo-600 font-bold animate-pulse">
            Analyse en cours...
        </div>

        <div id="result" class="hidden mt-6 animate-result"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput'), 
              dropZone = document.getElementById('dropZone'), 
              btn = document.getElementById('btn'), 
              resultDiv = document.getElementById('result');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => { if(e.target.files.length > 0) btn.disabled = false; };

        btn.onclick = async () => {
            const fd = new FormData();
            fd.append('file', fileInput.files[0]);
            fd.append('importe_par_user_id', '1');
            
            btn.classList.add('hidden'); 
            document.getElementById('loader').classList.remove('hidden');
            resultDiv.classList.add('hidden');
            
            try {
                const res = await fetch("http://127.0.0.1:8001/import", { method: "POST", body: fd });
                const json = await res.json();
                
                if (!res.ok) throw { status: res.status, message: json.detail || "Erreur serveur" };
                
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML = `<div class="p-4 rounded-xl border bg-green-50 border-green-200 text-green-800 font-bold shadow-sm">✅ ${json.message}</div>`;
                
            } catch (error) {
                resultDiv.classList.remove('hidden');
                const cfg = { 
                    409: ["amber", "⚠️", "Doublon"], 
                    422: ["blue", "📄", "Format"], 
                    500: ["red", "🔥", "Erreur"] 
                };
                const c = cfg[error.status] || ["red", "❌", "Erreur"];
                resultDiv.innerHTML = `<div class="p-4 rounded-xl border bg-${c[0]}-50 border-${c[0]}-200 text-${c[0]}-800 shadow-sm"><strong class="block">${c[1]} ${c[2]}</strong><span class="text-sm font-normal">${error.message}</span></div>`;
            } finally {
                document.getElementById('loader').classList.add('hidden');
                btn.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
